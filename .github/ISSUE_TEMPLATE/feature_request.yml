name: ✨ Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why / how would you use it?
  - type: input
    id: target
    attributes:
      label: Target app (Unity, Blender, Maya, iClone, other)
